syntax = "proto3";

package tankgame;

option go_package = "server/proto";


// 连接成功，分配给客户端的 player_id
message ConnectSuccess {
  string your_player_id = 1;
}

// 房间信息
message RoomInfo {
  string room_id = 1;
  repeated string player_ids = 2;
  string status = 3; // "waiting", "playing", "ended"
  string host_id = 4; // 房主ID
  int32 max_players = 5; // 最大玩家数
  string room_name = 6; // 房间名称
}

// 房间列表
message RoomList {
  repeated RoomInfo rooms = 1;
}

// 创建房间请求
message CreateRoomRequest {
  string room_name = 1;
  int32 max_players = 2;
}


// 加入房间请求
message JoinRoomRequest {
  string room_id = 1;
}



// 玩家输入类型
enum InputType {
  INPUT_NONE = 0;
  INPUT_MOVE_UP = 1;
  INPUT_MOVE_DOWN = 2;
  INPUT_MOVE_LEFT = 3;
  INPUT_MOVE_RIGHT = 4;
  INPUT_SHOOT = 5;
}

// 玩家输入
message PlayerInput {
  string player_id = 1;
  InputType input_type = 2;
  int64 frame_number = 3;
  int64 timestamp = 4;
}

// 帧输入转发
message FrameInputs {
  int64 frame_number = 1;
  repeated PlayerInput inputs = 2;
}

// 游戏开始
message GameStart {
  string room_id = 1;
  repeated string player_ids = 2;
  int64 random_seed = 3; // 新增
}

message RoomListRequest {}

message GameStartRequest{
  string room_id = 1;
}


// 服务器消息
message ServerMessage {
  oneof data {
    FrameInputs frame_inputs = 1;
    RoomInfo room_info = 2;
    GameStart game_start = 3;
    ConnectSuccess connect_success = 4;
    RoomList room_list = 5;

  }
}




// 客户端消息
message ClientMessage {
  oneof data {
    PlayerInput player_input = 1;
    CreateRoomRequest create_room_request = 2;
    JoinRoomRequest join_room_request = 3;
    RoomListRequest room_list_request = 4;
    GameStartRequest game_start_request=5;
  }
}